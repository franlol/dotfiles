name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan-current:
    name: Scan Current Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run gitleaks (current files)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git \
            --report-format sarif --report-path /repo/gitleaks-current.sarif
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git \
            --report-format json --report-path /repo/gitleaks-current.json

      - name: Upload current SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-current-sarif
          path: gitleaks-current.sarif

      - name: Upload current JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-current-json
          path: gitleaks-current.json

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-current.sarif

  scan-history:
    name: Scan Full History
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (git history)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo \
            --report-format sarif --report-path /repo/gitleaks-history.sarif
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo \
            --report-format json --report-path /repo/gitleaks-history.json

      - name: Upload history SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-sarif
          path: gitleaks-history.sarif

      - name: Upload history JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-json
          path: gitleaks-history.json

      - name: Upload history SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-history.sarif
